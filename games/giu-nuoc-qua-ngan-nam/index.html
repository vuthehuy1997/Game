<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giữ Nước Qua Ngàn Năm · Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Pattaya&display=swap">
<link rel="stylesheet" href="../../platform/css/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" width="960" height="540" aria-label="Chiến trường"></canvas>
  <div class="menu" id="menu" hidden></div>
  <div class="cardWrap" id="cardWrap" hidden><div class="card" id="card"></div></div>
  <div class="hud" id="hud" hidden>
    <button type="button" class="btn ghost" id="btnMineSub">Mỏ vàng −</button>
    <button type="button" class="btn ghost" id="btnMineAdd">Mỏ vàng +</button>
    <button type="button" class="btn ghost" id="btnTrainHouse">Huấn luyện thợ mỏ</button>
    <button type="button" class="btn" id="btnBarracks">Doanh trại</button>
    <button type="button" class="btn" id="btnStance">Phòng thủ</button>
  </div>
</div>
<p class="keys">Mỏ vàng +/− để gán/rút thợ · Huấn luyện thợ mỏ hoặc mở Doanh trại để tuyển lính · Đổi thế trận Phòng thủ/Tấn công</p>
<script type="module" src="js/main.js"></script>
</body>
</html>
