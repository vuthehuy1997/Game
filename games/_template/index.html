<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game mẫu · Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Pattaya&display=swap">
<link rel="stylesheet" href="../../platform/css/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" width="960" height="540" aria-label="Màn chơi"></canvas>
  <div class="touch" id="touch">
    <button data-k="left" aria-label="Sang trái">◀</button>
    <button data-k="right" aria-label="Sang phải">▶</button>
    <button data-k="jump">Nhảy</button>
  </div>
</div>
<p class="keys">A / D hoặc ← → để đi · Space để nhảy · nhặt đồng tiền</p>
<script type="module" src="main.js"></script>
</body>
</html>
