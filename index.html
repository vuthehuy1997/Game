<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Hub</title>
<meta name="description" content="Tuyển tập game chơi ngay trên trình duyệt.">
<link rel="stylesheet" href="platform/css/hub.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">▶</span><span>Game Hub</span></div>
  <button class="btn ghost" id="openSettings" type="button">Cài đặt</button>
</header>

<main>
  <section class="intro">
    <h1>Chọn game để chơi</h1>
    <p>Chơi ngay trên trình duyệt, không cần cài đặt. Tiến độ được lưu trên máy này. <span id="count"></span></p>
  </section>
  <ul class="games" id="games"></ul>
  <noscript><p>Trang này cần bật JavaScript.</p></noscript>
</main>

<dialog id="settings" aria-labelledby="setTitle">
  <form method="dialog">
    <h2 id="setTitle">Cài đặt chung</h2>
    <p class="hint">Áp dụng cho mọi game trên nền tảng.</p>
    <div class="fields">
      <label for="setMusic">Nhạc nền</label>
      <div class="rng"><input type="range" id="setMusic" min="0" max="100" step="5"><output id="outMusic" for="setMusic"></output></div>
      <label for="setSfx">Hiệu ứng âm thanh</label>
      <div class="rng"><input type="range" id="setSfx" min="0" max="100" step="5"><output id="outSfx" for="setSfx"></output></div>
      <label for="setShake">Rung màn hình</label>
      <input type="checkbox" id="setShake">
      <label for="setTouch">Nút cảm ứng</label>
      <select id="setTouch"><option value="auto">Tự động</option><option value="on">Luôn bật</option><option value="off">Tắt</option></select>
    </div>
    <div class="actions">
      <button class="btn ghost" id="setReset" type="button">Mặc định</button>
      <button class="btn" id="setDone">Xong</button>
    </div>
  </form>
</dialog>

<script type="module" src="platform/home.js"></script>
</body>
</html>
